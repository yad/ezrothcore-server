services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    pull_policy: always
    networks:
      - ac-network
    ports:
      - ${DOCKER_DB_EXTERNAL_PORT:-3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-password}
    volumes:
      - ac-database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  ac-db-import:
    container_name: ac-db-import
    image: clem007/ezrothcore-db-import:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - ac-network
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_characters"
    volumes:
      - ./etc:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy

  ac-modules-init:
    container_name: ac-modules-init
    image: clem007/ezrothcore-db-import:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    entrypoint: ["sh", "-c", "cp -r /azerothcore/modules/. /out/"]
    volumes:
      - ac-modules:/out

  ac-worldserver:
    container_name: ac-worldserver
    image: clem007/ezrothcore-worldserver:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - ac-network
    stdin_open: true
    tty: true
    # géré par ac-worldserver-watcher : ne pas laisser Docker le redémarrer
    # automatiquement, sinon le watcher ne peut jamais l'éteindre pour de bon.
    restart: "no"
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_characters"
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_playerbots"
    ports:
      - ${DOCKER_WORLD_EXTERNAL_PORT:-8085}:8085
      - ${DOCKER_SOAP_EXTERNAL_PORT:-7878}:7878
    volumes:
      - ./etc:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
      - ./data:/azerothcore/env/dist/data:ro
      - ac-modules:/azerothcore/modules:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-modules-init:
        condition: service_completed_successfully

  ac-authserver:
    container_name: ac-authserver
    image: clem007/ezrothcore-authserver:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - ac-network
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
    volumes:
      - ./etc:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
    ports:
      - ${DOCKER_AUTH_EXTERNAL_PORT:-3724}:3724
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-worldserver-watcher:
    container_name: ac-worldserver-watcher
    image: clem007/ezrothcore-watcher:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - ac-network
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-password}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/logs:ro
    depends_on:
      - ac-database
      - ac-authserver

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - ac-network
    command:
      - --admin-password-file
      - /run/secrets/portainer_admin_password
    ports:
      - ${DOCKER_PORTAINER_EXTERNAL_PORT:-9443}:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    secrets:
      - portainer_admin_password

volumes:
  ac-database:
  ac-modules:
  portainer-data:

networks:
  ac-network:

secrets:
  portainer_admin_password:
    file: ./secrets/portainer_admin_password.txt