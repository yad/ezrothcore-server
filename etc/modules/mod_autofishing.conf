#
# mod-autofishing configuration
#

###################################################################################################
#     AUTO-FISHING MODULE
#
#     AutoFishing.Enable
#         Enable or disable the auto-fishing module
#         Default: 1 (enabled)
#                  0 (disabled)
#

AutoFishing.Enable = 1

#
#     AutoFishing.BobberActivateSec
#         Fixed time in seconds before the bobber activates (fish bites)
#         Fishing channel is 20 seconds, max safe value is 17
#         Default: 14
#

AutoFishing.BobberActivateSec = 14

#
#     AutoFishing.RecastDelayMs
#         Delay in milliseconds before recasting after a catch
#         Default: 1500
#

AutoFishing.RecastDelayMs = 1500

#
#     AutoFishing.CatchDelayMs
#         Delay in milliseconds between bobber splash and auto-catch
#         Simulates player reaction time for visual effect
#         Default: 2000
#

AutoFishing.CatchDelayMs = 2000

#
